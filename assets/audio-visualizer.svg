<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="100%" height="80" fill="none">
  <defs>
    <linearGradient id="gradNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#4FACFE;#9B51E0;#00F2FE" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#4FACFE">
        <animate attributeName="stop-color" values="#4FACFE;#9B51E0;#00F2FE;#4FACFE" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#9B51E0">
        <animate attributeName="stop-color" values="#9B51E0;#00F2FE;#4FACFE;#9B51E0" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Accent Rail -->
  <rect x="0" y="38" width="1000" height="4" rx="2" fill="url(#gradNeon)" opacity="0.3" />

  <!-- Animated Equalizer Spectrum Bars -->
  <g filter="url(#glow)">
    <!-- Group 1 -->
    <rect x="50" y="25" width="6" height="30" rx="3" fill="url(#gradNeon)">
      <animate attributeName="height" values="10;50;20;60;30;10" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="35;15;30;10;25;35" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="65" y="20" width="6" height="40" rx="3" fill="url(#gradNeon)">
      <animate attributeName="height" values="40;15;55;25;10;40" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;32;12;27;35;20" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="80" y="15" width="6" height="50" rx="3" fill="url(#gradNeon)">
      <animate attributeName="height" values="20;65;15;50;30;20" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="30;7;32;15;25;30" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <rect x="95" y="30" width="6" height="20" rx="3" fill="url(#gradNeon)">
      <animate attributeName="height" values="15;40;60;10;35;15" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="32;20;10;35;22;32" dur="1.1s" repeatCount="indefinite" />
    </rect>

    <!-- Center Status Indicator -->
    <text x="500" y="46" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="16" letter-spacing="4" fill="url(#gradNeon)" text-anchor="middle" filter="url(#glow)">
      ⚡ AUTONOMOUS MEDIA PIPELINE &bull; HIGH PERFORMANCE ZERO-COPY ENGINE ⚡
      <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite" />
    </text>

    <!-- Group 2 -->
    <rect x="900" y="30" width="6" height="20" rx="3" fill="url(#gradNeon)">
      <animate attributeName="height" values="15;45;20;55;15;15" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="32;17;30;12;32;32" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <rect x="915" y="15" width="6" height="50" rx="3" fill="url(#gradNeon)">
      <animate attributeName="height" values="30;60;15;45;25;30" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="25;10;32;17;27;25" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="930" y="20" width="6" height="40" rx="3" fill="url(#gradNeon)">
      <animate attributeName="height" values="45;15;60;20;30;45" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="17;32;10;30;25;17" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="945" y="25" width="6" height="30" rx="3" fill="url(#gradNeon)">
      <animate attributeName="height" values="20;50;15;40;25;20" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="30;15;32;20;27;30" dur="1.7s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
